<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/reset-password.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow col-md-6 offset-md-3">
            <h3 class="text-center mb-3">Reset Your Password</h3>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control">
                </div>

                <div class="form-group mt-2">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control">
                </div>

                <div class="form-check mt-2">
                    <input type="checkbox" class="form-check-input" id="togglePassword">
                    <label class="form-check-label" for="togglePassword">Show Passwords</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Set New Password</button>
            </form>
        </div>
    </div>

  <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('resetForm');
        const messageBox = document.getElementById('message');

        if (!token) {
            form.style.display = 'none';
            messageBox.textContent = 'Invalid or missing reset token.';
            messageBox.style.color = 'red';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Mismatch',
                    text: 'Passwords do not match. Please try again.'
                });
                return;
            }

            try {
                const res = await fetch('http://localhost:8080/resetPassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await res.json();
                console.log(data);

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Password Reset!',
                        text: data.message || 'Your password has been successfully reset.',
                        timer: 3000,
                        timerProgressBar: true,
                        showConfirmButton: false
                    });

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message || data.error || 'An error occurred while resetting your password. Please try again later.',
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops',
                    text: error.message || 'An unexpected error occurred. Please try again later.'
                });
            }
        });

        document.getElementById('togglePassword').addEventListener('change', function () {
            const newPass = document.getElementById('newPassword');
            const confirmPass = document.getElementById('confirmPassword');
            const type = this.checked ? 'text' : 'password';
            console.log(type);
            newPass.type = type;
            confirmPass.type = type;
        });
    </script>
</body>
</html>
